packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@livekit/local-inference': true
  onnxruntime-node: true
  # tsx runs on esbuild; its postinstall fetches the platform binary.
  esbuild: true
  better-sqlite3: true
minimumReleaseAgeExclude:
  - '@orval/angular@8.38.0'
  - '@orval/axios@8.38.0'
  - '@orval/core@8.38.0'
  - '@orval/effect@8.38.0'
  - '@orval/fetch@8.38.0'
  - '@orval/hono@8.38.0'
  - '@orval/mcp@8.38.0'
  - '@orval/mock@8.38.0'
  - '@orval/pinia-colada@8.38.0'
  - '@orval/query@8.38.0'
  - '@orval/solid-start@8.38.0'
  - '@orval/swr@8.38.0'
  - '@orval/zod@8.38.0'
  - orval@8.38.0
  - '@livekit/agents-plugin-silero@1.9.1'
  - '@livekit/agents@1.9.1'
