services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
      target: control-plane
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      REDIS_URL: redis://redis:6379
      DATA_DIR: /app/data
      COURSES_DIR: /app/courses
      WEB_ORIGIN: http://127.0.0.1:5173,http://localhost:5173
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - control-plane-data:/app/data
    expose:
      - "3000"

  agent-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      control-plane:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      control-plane:
        condition: service_started

volumes:
  redis-data:
  control-plane-data:
