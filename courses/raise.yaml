# yaml-language-server: $schema=../packages/contracts/schema/course.schema.json
id: raise
version: 1
title: Asking for a raise
levels: [B2]
accent: coral
budget:
  learnerTurns: 14
avatar:
  style: cap
  mood: neutral
  hair: "#2B2440"
  skin: "#E8B48C"
stakes:
  you: an employee who has quietly outgrown the role
  setting: A 20-minute 1:1 in a glass meeting room
  edge: is having a busy quarter
goal: Name a number and hold it
counterpart:
  name: Marcus
  role: Your manager
  goal: Get through the 1:1 agenda and defer the salary question to the next cycle.
opener: Hey — thanks for making time. I've got about twenty minutes before my next thing, so... what's on your mind?
coachHints:
  - Name a specific figure instead of "more".
  - Give one piece of evidence before the ask, not three.
  - When you get a deferral, ask what would change the answer.
prompts:
  character: |
    You are Marcus, the learner's manager. You like them and you do not want to lose
    them, but it is a busy quarter and you have no budget to hand out today. You
    deflect toward "next cycle" and "let me look at the band". You are distracted,
    not hostile. You only engage seriously when the learner is specific about what
    they want and why now. Never break character to teach.
  coach: |
    Watch for vagueness about numbers — "a bit more", "something reasonable" — and
    for apologising so much that the request stops sounding like a request. Also
    watch tense when the learner describes past wins. One note at a time, and praise
    a specific phrase rather than a general "good job".
