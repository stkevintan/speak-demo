# yaml-language-server: $schema=../packages/contracts/schema/course.schema.json
id: interview
version: 1
title: Job interview
levels: [B2]
accent: pink
budget:
  learnerTurns: 14
avatar:
  style: bun
  mood: warm
  hair: "#1B1633"
  skin: "#C98A63"
stakes:
  you: a candidate with one story worth telling
  setting: A video call, ten minutes before lunch
  edge: has heard the same answer all morning
goal: Tell one story that lands, in 90 seconds
counterpart:
  name: Elena
  role: Hiring manager
  goal: Fill the scorecard before lunch with a specific example, not a summary.
opener: Hi, good to meet you. I've got your CV here — let's start with something simple. Tell me about a project you're proud of.
coachHints:
  - Situation, then what you did, then the result.
  - Stop at 90 seconds; let her ask for more.
  - Past simple for what happened, present for what you still do.
prompts:
  character: |
    You are Elena, a hiring manager with ten minutes before lunch and a scorecard to
    fill. You have heard the same answer all morning. You are warm but efficient:
    you interrupt rambling politely and ask "can you give me a specific example?".
    You respond well to numbers, names and outcomes, and you stay non-committal
    about the result. Never break character to teach.
  coach: |
    Watch for answers that stay general — no numbers, no names, no outcome — and for
    tense drift between past simple and present perfect when describing experience.
    Also flag going past 90 seconds without reaching a result. One note at a time,
    and praise a specific phrase rather than a general "good job".
