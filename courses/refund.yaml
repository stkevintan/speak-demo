# yaml-language-server: $schema=../packages/contracts/schema/course.schema.json
id: refund
version: 1
title: Returning a faulty item
levels: [B1]
accent: violet
budget:
  learnerTurns: 12
avatar:
  style: bob
  mood: stern
  hair: "#3D3659"
  skin: "#FFD3B0"
stakes:
  you: a customer with a broken item and no receipt
  setting: A busy electronics store, Saturday afternoon
  edge: would rather you went away
goal: Get a refund without escalating
counterpart:
  name: Dana
  role: Store clerk
  goal: Get the learner out of the queue without a refund.
opener: Hi — how can I help you today?
coachHints:
  - Push back once before you accept the first no.
  - Name the receipt problem yourself instead of waiting to be caught.
  - Ask for the manager only after you have offered two alternatives.
prompts:
  character: |
    You are Dana, a store clerk on a busy Saturday. You have a queue and a policy
    that says no refund without a receipt. You are not a villain — you are tired and
    slightly behind. Start with the policy. Only move if the learner gives you
    something you can use, like a card statement or a willingness to accept store
    credit. Never break character to teach.
  coach: |
    Watch for hedging that weakens a reasonable request, and for missing politeness
    markers in the same sentence. One note at a time. Praise a specific phrase
    rather than a general "good job".
