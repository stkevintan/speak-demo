<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>02 Scene picker</title>
<link rel="stylesheet" href="_base.css">
<link rel="stylesheet" href="_app.css">
<style>
  .main{padding:0 46px}
  .head{display:flex;align-items:flex-end;gap:18px;margin:6px 0 18px}
  .head h2{margin:0;font-size:32px;font-weight:900;letter-spacing:-0.8px}
  .head .count{margin-left:auto;font-size:14px;font-weight:800;color:var(--muted)}
  .grid-3{gap:20px}
  .scene-card{padding:20px 22px 16px}
  .sc-title{font-size:20px;margin-top:13px}
  .sc-setting{margin-top:8px}
</style>
</head>
<body>
<div class="screen">
  <div class="blob" data-bleed style="width:560px;height:560px;background:#FFDDD0;left:-160px;top:-180px"></div>
  <div class="blob" data-bleed style="width:520px;height:520px;background:#D9CCFF;right:-150px;top:-120px"></div>

  <div class="topbar">
    <div class="brand">
      <span style="display:flex" id="brandPip"></span>
      Rehearsal
    </div>
    <div class="grow"></div>
    <span class="pill" style="background:var(--violet-soft);color:#5B3FD6">Level B1</span>
    <div class="icon-btn" id="settings"></div>
  </div>

  <div class="main">
    <div class="memory">
      <span id="memPip"></span>
      <div class="txt">
        Welcome back, Mai. Last time past tense slipped <b>3 times</b> —
        let's see if it sticks.
      </div>
      <div class="switch-row" style="margin-left:auto">
        Chinese hints <span class="switch"></span>
      </div>
    </div>

    <div class="head">
      <h2>Pick a scene</h2>
      <div class="count">6 scenes · about 5 min each</div>
    </div>

    <div class="grid-3" id="grid"></div>
  </div>
</div>

<script src="_mascot.js"></script>
<script src="_icons.js"></script>
<script src="_scenes.js"></script>
<script src="_check.js"></script>
<script>
  document.getElementById('brandPip').innerHTML = pipSvg(34, 'idle');
  document.getElementById('memPip').innerHTML = pipSvg(48, 'write');
  document.getElementById('settings').innerHTML = icon('settings', 20, '#3D3659', 2.2);
  document.getElementById('grid').innerHTML = SCENES.map(s => sceneCard(s)).join('');
</script>
</body>
</html>
