<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>04 Live states</title>
<link rel="stylesheet" href="_base.css">
<link rel="stylesheet" href="_app.css">
<style>
  .head{padding:0 44px;margin:2px 0 20px}
  .head h2{margin:0;font-size:30px;font-weight:900;letter-spacing:-0.8px}
  .head p{margin:8px 0 0;font-size:15px;font-weight:650;color:var(--muted);max-width:760px;line-height:1.5}
  .states{padding:0 44px 24px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;height:660px}
  .st{background:#fff;border-radius:32px;box-shadow:var(--sh-md);padding:24px 20px;
      display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;overflow:hidden}
  .st::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--c)}
  .st .pip{margin-top:8px}
  .st .state-chip{margin-top:6px}
  .st h3{margin:20px 0 0;font-size:19px;font-weight:900;letter-spacing:-0.3px}
  .st .desc{font-size:13.5px;font-weight:650;color:var(--muted);line-height:1.5;margin:9px 0 0}
  .st .note{margin-top:auto;padding-top:16px;font-size:12.5px;font-weight:800;
            line-height:1.45;border-top:2px solid var(--line);width:100%}
  .st .note span{display:block;font-weight:650;color:var(--muted);margin-top:3px}
  .wave{height:44px;margin-top:16px}
</style>
</head>
<body>
<div class="screen">
  <div class="blob" data-bleed style="width:520px;height:520px;background:#E4DBFF;left:-190px;top:-180px"></div>
  <div class="blob" data-bleed style="width:480px;height:480px;background:#FFE0D4;right:-170px;bottom:-190px"></div>

  <div class="topbar">
    <div class="brand"><span style="display:flex" id="brandPip"></span> Rehearsal</div>
    <span class="pill" style="background:#fff;box-shadow:var(--sh-sm);color:var(--ink-2)">Design principle</span>
    <div class="grow"></div>
    <div class="icon-btn" id="settings"></div>
  </div>

  <div class="head">
    <h2>Silence is never ambiguous</h2>
    <p>Four states, each with its own colour, its own Pip expression, and a plain-English label.
       You always know whether it's your turn — the app never just goes quiet on you.</p>
  </div>

  <div class="states" id="states"></div>
</div>

<script src="_mascot.js"></script>
<script src="_icons.js"></script>
<script src="_check.js"></script>
<script>
  const bars = [10,18,28,20,36,24,14,30,40,22,12,26,34,18,10,24,16,8];

  const STATES = [
    {
      c: '#12C8A0', ink: '#08735a', pip: 'listen', cls: 'state-listen', dot: 'var(--teal)',
      chip: 'Listening — take your time',
      h: 'The mic is open',
      d: 'Pip leans in and the waveform goes green. Dana has finished and nothing is expected of you until you actually speak.',
      n: 'You can pause for as long as you like',
      s: 'No countdown, no "are you still there?".',
    },
    {
      c: '#7C5CFF', ink: '#5b3fd6', pip: 'think', cls: 'state-think', dot: '#5b3fd6',
      chip: 'Thinking…',
      h: 'The floor is held',
      d: 'You trailed off mid-sentence. The tutor waits instead of filling the gap, and Pip looks up so you know it heard you.',
      n: 'Roughly 4 seconds before it helps',
      s: 'Then it offers a word, never a lecture.',
    },
    {
      c: '#FF6B4A', ink: '#b23a1a', pip: 'idle', cls: 'state-speak', dot: '#ff6b4a',
      chip: 'Dana is speaking',
      h: 'Whoever talks is labelled',
      d: 'Dana has the floor. Her bubble is on the left, yours on the right, and the chip names her so you never guess.',
      n: 'Pip never talks over her',
      s: 'Coach cards wait until she stops.',
    },
    {
      c: '#FFC93C', ink: '#8a6013', pip: 'write', cls: 'state-note', dot: 'var(--sun)',
      chip: 'Coach is taking a note',
      h: 'A note, not an interruption',
      d: 'Something is worth mentioning. Pip scribbles in the rail — no popup, no sound, no stopping the scene to correct you.',
      n: 'You see it when you pause',
      s: 'Never mid-sentence, never twice.',
    },
  ];

  document.getElementById('brandPip').innerHTML = pipSvg(34, 'idle');
  document.getElementById('settings').innerHTML = icon('settings', 20, '#3D3659', 2.2);

  document.getElementById('states').innerHTML = STATES.map(s => `
    <article class="st" style="--c:${s.c}">
      <div class="pip">${pipSvg(132, s.pip)}</div>
      <div class="state-chip ${s.cls}">
        <span class="dot" style="background:${s.dot}"></span> ${s.chip}
      </div>
      <div class="wave" style="color:${s.c}">
        ${bars.map(v => `<i style="height:${v}px;background:${s.c}"></i>`).join('')}
      </div>
      <h3>${s.h}</h3>
      <p class="desc">${s.d}</p>
      <div class="note" style="color:${s.ink}">${s.n}<span>${s.s}</span></div>
    </article>`).join('');
</script>
</body>
</html>
