# nginx config for the Fly.io deployment of the web app.
#
# Differs from apps/web/nginx.conf in exactly one way: the API upstream. On
# Compose the control plane is a sibling container resolvable as
# "control-plane"; on Fly it is a separate app reachable over the private
# network.
#
# apps/web/Dockerfile takes the file to install as the NGINX_CONF build arg;
# fly.web.toml passes this path. docker-compose.yml keeps using the default,
# so both deployment paths stay working.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    # fdaa::3 is the resolver Fly writes into every Machine's /etc/resolv.conf,
    # and it is the only place that knows about *.internal names.
    resolver [fdaa::3] valid=5s ipv6=on;
    set $api_upstream "rehearsal-api.internal";

    # No trailing slash and no URI part: the request path is forwarded
    # unchanged, so /api/me arrives at the API as /api/me. nginx only performs
    # runtime DNS resolution when proxy_pass contains a variable, which is what
    # lets this Machine boot before the API app exists and recover by itself
    # after the API is redeployed onto new Machines.
    proxy_pass http://$api_upstream:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
